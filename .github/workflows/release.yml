name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Verify the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          MIN_APP=$(node -p "require('./manifest.json').minAppVersion")
          VERSIONS_ENTRY=$(node -p "require('./versions.json')['$MANIFEST_VERSION'] || ''")
          if [ "$VERSIONS_ENTRY" != "$MIN_APP" ]; then
            echo "versions.json is missing or wrong for $MANIFEST_VERSION (expected $MIN_APP, got '$VERSIONS_ENTRY')"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft \
            main.js manifest.json versions.json