name: Release

# Releases are cut from main, never from a pushed tag: the workflow reads the
# version out of manifest.json and creates the tag itself, so the two can't
# disagree — which is what Obsidian checks for.
#
# Bump "version" in manifest.json on a feature branch, add the matching entry to
# versions.json, and merge. Merging anything that does NOT change the version is
# a no-op, so ordinary merges never produce a release.
#
# The same checks run on pull requests, so a bad version or a missing
# versions.json entry fails on the PR rather than after the merge.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reupload_assets:
        description: "Re-attach main.js/manifest.json/versions.json to the existing release for the current manifest version"
        type: boolean
        default: false

permissions:
  contents: write

# Two merges landing back to back must not race to create the same tag.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read manifest.json
        id: manifest
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          MIN_APP=$(node -p "require('./manifest.json').minAppVersion")

          # Obsidian requires the release tag to equal the manifest version
          # exactly, with no "v" prefix, so reject anything that would tag badly.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=manifest.json::version \"$VERSION\" is not a bare semver string (no \"v\" prefix allowed)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "min_app=$MIN_APP" >> "$GITHUB_OUTPUT"
          echo "manifest version $VERSION (minAppVersion $MIN_APP)"

      # Obsidian reads versions.json to decide which plugin version a given app
      # version may install, so the entry has to be committed before the tag is
      # cut. A ruleset on main means this workflow can't commit it for you, which
      # is why the check also runs on the pull request.
      - name: Check versions.json
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
          MIN_APP: ${{ steps.manifest.outputs.min_app }}
        run: |
          CURRENT=$(node -p "require('./versions.json')['$VERSION'] || ''")
          if [ "$CURRENT" = "$MIN_APP" ]; then
            echo "versions.json maps $VERSION -> $MIN_APP"
            exit 0
          fi
          if [ -z "$CURRENT" ]; then
            echo "::error file=versions.json::versions.json has no entry for $VERSION. Add \"$VERSION\": \"$MIN_APP\" to versions.json in this pull request."
          else
            echo "::error file=versions.json::versions.json maps $VERSION to $CURRENT, but manifest.json says minAppVersion is $MIN_APP. Make them agree."
          fi
          exit 1

      - name: Decide what to do
        id: plan
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
          REUPLOAD: ${{ inputs.reupload_assets }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            if [ "$REUPLOAD" = "true" ]; then
              ACTION=reupload
              echo "Release $VERSION exists; re-attaching assets as requested."
            else
              ACTION=skip
              echo "Release $VERSION already exists. Bump manifest.json to cut a new one."
            fi
          else
            ACTION=create
            echo "No release for $VERSION yet; creating it."
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "$VERSION: $ACTION" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release commit
        if: steps.plan.outputs.action == 'create'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists on the remote; the release will reuse it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"

      - name: Create the release
        if: steps.plan.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            main.js manifest.json versions.json

      - name: Re-attach assets to the existing release
        if: steps.plan.outputs.action == 'reupload'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          gh release upload "$VERSION" \
            main.js manifest.json versions.json --clobber
